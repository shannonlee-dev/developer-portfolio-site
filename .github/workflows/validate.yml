name: 저장소 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 문서와 재현 절차 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 잠금 파일로 개발 도구 설치
        run: npm ci
      - name: 문법과 문서 검사
        run: make check
      - name: 화면 기능과 정적 자산 테스트
        run: make test
